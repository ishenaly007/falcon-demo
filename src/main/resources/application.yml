spring:
  application:
    name: worktime

  datasource:
    # Файловая H2: данные лежат в ./data/worktime.mv.db и переживают перезапуск.
    # Переопределяется переменной окружения DB_URL (например, для Docker-тома).
    url: ${DB_URL:jdbc:h2:file:./data/worktime}
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      # Схемой управляет только Liquibase, Hibernate лишь сверяет маппинг.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8080}

app:
  # Часовой пояс, в котором трактуются даты отчёта ("с 1 по 7 ноября").
  time-zone: ${APP_TIME_ZONE:Asia/Bishkek}
  # Максимальная длина периода отчёта, дней.
  max-report-days: 366
